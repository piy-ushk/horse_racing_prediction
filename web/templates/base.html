<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}競馬予想システム{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff; padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.3rem; letter-spacing: .05em; }
    header nav a { color: #e0e0e0; text-decoration: none; margin-left: 20px; font-size: .9rem; }
    header nav a:hover { color: #d4af37; }
    main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    .card {
      background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 24px; margin-bottom: 24px;
    }
    .btn {
      display: inline-block; padding: 10px 22px; border-radius: 6px; border: none;
      cursor: pointer; font-size: .95rem; font-weight: 600; text-decoration: none;
    }
    .btn-primary { background: #1a1a2e; color: #fff; }
    .btn-primary:hover { background: #16213e; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-success:hover { background: #219150; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e0e0e0; padding: 9px 14px; text-align: center; }
    thead { background: #1a1a2e; color: #fff; }
    tbody tr:nth-child(even) { background: #f7f7f7; }
    .mark { font-size: 1.5em; font-weight: bold; }
    .mark-1 { color: #d4af37; }
    .mark-2 { color: #888; }
    .mark-3 { color: #cd7f32; }
    .mark-4 { color: #aaa; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: .78rem; font-weight: 600; letter-spacing: .03em;
    }
    .badge-demo { background: #fff3cd; color: #856404; }
    footer { text-align: center; padding: 32px; color: #999; font-size: .8rem; }
  </style>
</head>
<body>
<header>
  <h1>🏇 競馬予想システム MVP</h1>
  <nav>
    <a href="/">ダッシュボード</a>
    <a href="/logs">ログ</a>
    <a href="/admin">管理</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>Horse Racing Prediction MVP &copy; 2025 — Demo Mode</footer>
</body>
</html>
